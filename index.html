<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supplier Management System</title>
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/lito130/supplier-directory/main/pngtree-ic-electronic-chip-in-cartoon-style-vector-illustration-png-image_9163673.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { 
      width: 100%; 
      height: 100%; 
      overflow: hidden; 
      background: #0a0e1a; 
    }
  
    iframe { 
      position: fixed;
      top: 0;
      left: 0;
      width: 100%; 
      height: 100%; 
      border: none; 
      display: block; 
    }
    #loader {
      position: fixed; inset: 0; background: #0a0e1a;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 9999; transition: opacity 0.6s ease;
    }
    #loader.hidden { opacity: 0; pointer-events: none; }
    #loader img { width: 72px; height: 72px; margin-bottom: 24px; object-fit: contain; }
    .spinner {
      width: 44px; height: 44px; border: 4px solid rgba(79,70,229,0.2);
      border-top-color: #4f46e5; border-radius: 50%; animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loader p { color: #94a3b8; margin-top: 18px; font-family: 'Segoe UI', sans-serif; font-size: 14px; letter-spacing: 0.5px; }
  </style>
</head>
<body>
  <div id="loader">
    <img src="https://raw.githubusercontent.com/lito130/supplier-directory/main/pngtree-ic-electronic-chip-in-cartoon-style-vector-illustration-png-image_9163673.png" alt="Logo">
    <div class="spinner"></div>
    <p>Loading Supplier Management System…</p>
  </div>
  <iframe 
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbwN6spi5YNrqqcA3LoFeTFpBsig3oqkLGyJp22nCWTBJQC0a0DnHH7zW34JuaIn_nT2-A/exec" 
    
    
    allowfullscreen
    allow="geolocation"
    >
  </iframe>
  <script>
    setTimeout(function() { document.getElementById('loader').classList.add('hidden'); }, 20000);   

    
    (function () {
      var KEYS = ['sd_session', 'sd_page'];
      var ALLOWED = /^https:\/\/([a-z0-9-]+\.)*(googleusercontent\.com|google\.com)$/;
      window.addEventListener('message', function (e) {
        if (!ALLOWED.test(e.origin)) return;
        var d = e.data;
        if (!d || typeof d.sdType !== 'string') return;
        try {
          if (d.sdType === 'get') {
            e.source.postMessage({
              sdType: 'state',
              session: sessionStorage.getItem('sd_session'),
              page: sessionStorage.getItem('sd_page')
            }, e.origin);
          } else if (d.sdType === 'save' && KEYS.indexOf(d.key) > -1 && typeof d.value === 'string') {
            sessionStorage.setItem(d.key, d.value);
          } else if (d.sdType === 'ready') {
            document.getElementById('loader').classList.add('hidden');
          } else if (d.sdType === 'clear') {
            KEYS.forEach(function (k) { sessionStorage.removeItem(k); });
          }
        } catch (err) {}
      });
    })();

  </script>
</body>
</html>
